# =============================================================================
# KMP Product Flavors — Single version source of truth
# Bump this ONE value to release. mbl-actionhub auto-opens a bump PR after publish.
# Current: 2.9.0. Next patch: 2.9.1 | minor: 2.10.0 | major: 3.0.0
# =============================================================================
kmpflavors.version=2.9.0

# Maven Central Publishing (vanniktech 0.36.0 reads these from gradle.properties)
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official

# MPP
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
