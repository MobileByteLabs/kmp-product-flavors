# AGP matrix compatibility (v2.6) — AgpBridge parity across AGP versions
#
# Companion to multi-kgp-matrix.yml. Whereas multi-kgp-matrix pins the Kotlin
# Gradle Plugin row and exercises the TestKit + multi-target samples, this
# workflow pins the Android Gradle Plugin row and runs the AgpBridge unit
# tests against each pinned AGP. Catches the failure mode where AGP renames
# or restructures `productFlavors[]` / `flavorDimensions[]` reflection paths
# (the bridge consumes these via reflection — no AGP compile-time dep).
#
# Trigger scope is narrowed to AgpBridge sources + the workflow itself; KMP-
# side changes do not need to re-run this matrix.

name: AGP matrix compatibility (v2.6)

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'build-logic/flavor-plugin/src/main/kotlin/com/mobilebytelabs/kmpflavors/internal/AgpBridge.kt'
      - 'build-logic/flavor-plugin/src/test/kotlin/com/mobilebytelabs/kmpflavors/AgpBridge*'
      - 'build-logic/flavor-plugin/src/test/kotlin/com/mobilebytelabs/kmpflavors/internal/AgpBridge*'
      - '.github/workflows/agp-matrix-compat.yml'
  workflow_dispatch:
    inputs:
      agp-version:
        description: 'Pin to one specific AGP row (leave empty to fan out across all rows)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agp-matrix-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agp-matrix:
    name: AGP ${{ matrix.agp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned AGP versions covering 8.x stable line + 9.x preview.
        # Source of truth lives in the plan's Tier B spec; bump here in lockstep
        # with documented AGP support window in DEVELOPMENT.md.
        agp: ['8.0.2', '8.5.2', '8.10.0', '9.0.0-rc01']
    steps:
      - uses: actions/checkout@v4

      - name: Skip when manual dispatch targets a different row
        if: github.event_name == 'workflow_dispatch' && inputs.agp-version != '' && inputs.agp-version != matrix.agp
        run: |
          echo "::notice::Manual dispatch targets AGP ${{ inputs.agp-version }}; skipping row ${{ matrix.agp }}."
          exit 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Pin AGP version in libs.versions.toml to the matrix row
        run: |
          set -euo pipefail
          # Atomic swap of the single-line `agp = "X.Y.Z"` entry. POSIX-portable
          # regex (matches both BSD + GNU sed). Mirrors multi-kgp-matrix.yml.
          sed -i.bak -E 's/^agp = ".*"$/agp = "${{ matrix.agp }}"/' gradle/libs.versions.toml
          if grep -qE '^agp = "${{ matrix.agp }}"$' gradle/libs.versions.toml; then
            echo "✓ pinned agp = ${{ matrix.agp }}"
          else
            echo "::error::agp pin swap failed — current libs.versions.toml top-15 lines:"
            head -15 gradle/libs.versions.toml
            exit 1
          fi
          rm -f gradle/libs.versions.toml.bak

      - name: Run AgpBridge tests against AGP ${{ matrix.agp }}
        run: |
          ./gradlew :build-logic:flavor-plugin:test \
            --tests "*AgpBridgeTest*" \
            --tests "*AgpBridgeMultiDimTest*" \
            --no-daemon --no-configuration-cache --warning-mode=summary

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agp-bridge-reports-agp-${{ matrix.agp }}
          path: build-logic/flavor-plugin/build/reports/tests/test/
          retention-days: 14
