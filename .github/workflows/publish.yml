# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Schedule: every Monday 00:00 UTC
#   - Schedule: 1st of every month 00:00 UTC
#   - Manual dispatch: workflow_dispatch (optional version override)
#
# Version source of truth: gradle.properties → kmpflavors.version
#   The committed value is what gets published. Bumping the version is a code
#   review concern. Maven Central is consulted only as a sanity check.

name: Publish

on:
  schedule:
    - cron: '0 0 * * 1'   # weekly — every Monday 00:00 UTC
    - cron: '0 0 1 * *'   # monthly — 1st of every month 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty to use kmpflavors.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write          # release creation, tag push, branch push for bump PR
  pull-requests: write     # bump-after-release opens a PR

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.4.0
    with:
      module-pattern: 'flavor-plugin'
      group-id: 'io.github.mobilebytelabs.kmpflavors'
      artifact-id: 'flavor-plugin'
      version: ${{ inputs.version || '' }}
      gradle-properties-key: 'kmpflavors.version'
      verify-against-maven: true
      bump-after-release: true
      next-bump-type: 'patch'
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: true
    secrets: inherit

  publish-plugin-portal:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Gradle Plugin Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
        run: |
          ./gradlew :build-logic:flavor-plugin:publishPlugins \
            --no-daemon \
            --no-configuration-cache \
            -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} \
            -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
