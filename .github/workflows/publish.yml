# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Schedule: every Monday 00:00 UTC
#   - Schedule: 1st of every month 00:00 UTC
#   - Manual dispatch: workflow_dispatch (optional version override)
#
# Version source of truth: gradle.properties → kmpflavors.version
# After a successful publish, opens a bump PR to increment the patch version.

name: Publish

on:
  schedule:
    - cron: '0 0 * * 1'   # weekly — every Monday 00:00 UTC
    - cron: '0 0 1 * *'   # monthly — 1st of every month 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty to use kmpflavors.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.5.1
    with:
      module-path: 'build-logic/flavor-plugin'
      group-id: 'io.github.mobilebytelabs.kmpflavors'
      artifact-id: 'flavor-plugin'
      version: ${{ inputs.version || '' }}
      version-source: 'gradle-properties'
      gradle-properties-key: 'kmpflavors.version'
      verify-against-maven: true
      create-github-release: true
      bump-after-release: true
      next-bump-type: 'patch'
      bump-pr-base-branch: 'development'
      publish-gradle-plugin-portal: true
      java-version: '21'
      java-distribution: 'zulu'
    secrets: inherit
