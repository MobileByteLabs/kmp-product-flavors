# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Schedule: every Monday 00:00 UTC
#   - Schedule: 1st of every month 00:00 UTC
#   - Manual dispatch: workflow_dispatch (optional version override) — force a
#     release by triggering from the Actions tab UI or via
#     `gh workflow run publish.yml --repo MobileByteLabs/kmp-product-flavors --ref development`.
#
# Version source of truth: gradle.properties → kmpflavors.version
# After a successful publish, opens a bump PR to increment the patch version.

name: Publish

on:
  schedule:
    - cron: '0 0 * * 1'   # weekly — every Monday 00:00 UTC
    - cron: '0 0 1 * *'   # monthly — 1st of every month 00:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty to use kmpflavors.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  preflight:
    # Block publishing of any commit that has not been validated on the same SHA.
    # Two workflows can satisfy this:
    #   - "PR Check" runs on pull_request — green when a contributor's PR was tested.
    #   - "CI"       runs on push to development — green when post-merge validation
    #                finished on the merged commit.
    # Either workflow being SUCCESS proves the commit was tested. PR Check does NOT
    # auto-run on push to development, so requiring PR Check alone would block
    # every post-merge publish — accept CI as an equivalent gate.
    name: Preflight — require PR Check or CI green on head_sha
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation workflow succeeded on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Looking for a successful 'PR Check' or 'CI' run on $HEAD_SHA"
          PR_CHECK_COUNT=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "PR Check" \
            --commit "$HEAD_SHA" \
            --status success \
            --json conclusion \
            --jq 'length')
          CI_COUNT=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "CI" \
            --commit "$HEAD_SHA" \
            --status success \
            --json conclusion \
            --jq 'length')
          TOTAL=$((PR_CHECK_COUNT + CI_COUNT))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No successful validation run (PR Check or CI) found for $HEAD_SHA."
            echo "::error::This commit has not been validated. Wait for PR Check / CI to complete, or re-run them on this commit, then re-trigger publish."
            exit 1
          fi
          echo "✓ Found $PR_CHECK_COUNT PR Check + $CI_COUNT CI successful run(s) on $HEAD_SHA — proceeding."

  publish:
    needs: preflight
    # v1.6.0+ — pre-release-aware GitHub Release flag auto-detection
    # (pairs with mbl-actionhub-bump-version v1.6.0+'s SemVer-pre-release-aware bump,
    # pinned by the publish-kmp-library workflow internally). See docs/RELEASE.md.
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.6.1
    with:
      module-path: 'build-logic/flavor-plugin'
      group-id: 'io.github.mobilebytelabs.kmpflavors'
      artifact-id: 'flavor-plugin'
      version: ${{ inputs.version || '' }}
      version-source: 'gradle-properties'
      gradle-properties-key: 'kmpflavors.version'
      verify-against-maven: true
      create-github-release: true
      bump-after-release: true
      next-bump-type: 'patch'
      bump-pr-base-branch: 'development'
      publish-gradle-plugin-portal: true
      java-version: '21'
      java-distribution: 'zulu'
    secrets: inherit

  release-notes-from-changelog:
    name: Sync release notes from CHANGELOG.md
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve published version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep '^kmpflavors.version=' gradle.properties | cut -d= -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract changelog section
        id: extract
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          python3 - "$VERSION" >/tmp/release-body.md <<'PYEOF'
          import re, pathlib, sys
          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          # Match "## [<version>] ..." up to the next "## [" header or EOF.
          # Pattern kept on ONE source line so the outer YAML `run: |` block
          # scalar isn't terminated by an unindented continuation. The prior
          # multi-line rf"..." form left a stray "]*" at column 0 which broke
          # YAML parsing — that's why the workflow registry never picked up
          # name: Publish or the workflow_dispatch trigger.
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, changelog, re.DOTALL)
          if not m:
              print(f"# v{version}\n\nNo CHANGELOG entry found for this version.")
              sys.exit(0)
          body = m.group(1).rstrip()
          print(f"# v{version}\n")
          print(body)
          print()
          print("---")
          print()
          print(f"**Maven Central:** `io.github.mobilebytelabs.kmpflavors:flavor-plugin:{version}`")
          print(f"**Plugin Portal:** `io.github.mobilebytelabs.kmp-product-flavors:{version}`")
          PYEOF
          echo "Generated release body:"
          cat /tmp/release-body.md
      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Wait briefly for the upstream publish job's release-create step to settle.
          for i in 1 2 3 4 5; do
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            echo "Release v$VERSION not yet visible — sleeping 10s ($i/5)"
            sleep 10
          done
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-body.md
          echo "✓ Release notes updated for v$VERSION"
