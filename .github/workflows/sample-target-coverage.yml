# v2.5 — Sample Target Coverage CI
#
# Companion to sample-multi-target.yml. Where sample-multi-target.yml exercises
# the v2.4 baseline (iOS + Desktop + JS + WasmJs = 6 non-Android targets, 54
# compilations), this workflow extends coverage to the v2.5 expansion set:
#
#   - macOS runner: watchOS×3 + tvOS×3 (6 Apple targets)
#   - Linux runner: linuxX64 (1 native target)
#   - Windows runner: mingwX64 (1 native target)
#
# Combined with sample-multi-target.yml, the full v2.5 matrix is 14 non-Android
# targets × 9 variants = 126 compilations. CI minutes growth measured + posted
# to PR comment so the v2.5 GOAL.md AC 10 budget (≤ 2× v2.4 baseline) is observable.
#
# PlatformDetector has supported all of these targets since v1.1.0; this workflow
# locks in the sample-side coverage so future target-naming changes don't silently
# drop a target from the matrix.

name: Sample Target Coverage (v2.5)

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'build-logic/flavor-plugin/**'
      - 'samples/multi-target-multi-variant/**'
      - 'settings.gradle.kts'
      - '.github/workflows/sample-target-coverage.yml'
  push:
    branches: [development, main]

permissions:
  contents: read
  pull-requests: write   # for cost-telemetry PR comment

concurrency:
  group: sample-target-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # macOS runner: watchOS (3 archs) + tvOS (3 archs) = 6 Apple targets
  # ─────────────────────────────────────────────────────────────────────
  apple-targets-extended:
    name: Apple targets (watchOS×3 + tvOS×3)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Default variant — watchOS targets compile
        run: |
          ./gradlew \
            :samples:multi-target-multi-variant:compileKotlinWatchosX64 \
            :samples:multi-target-multi-variant:compileKotlinWatchosArm64 \
            :samples:multi-target-multi-variant:compileKotlinWatchosSimulatorArm64 \
            --no-daemon --no-configuration-cache

      - name: Default variant — tvOS targets compile
        run: |
          ./gradlew \
            :samples:multi-target-multi-variant:compileKotlinTvosX64 \
            :samples:multi-target-multi-variant:compileKotlinTvosArm64 \
            :samples:multi-target-multi-variant:compileKotlinTvosSimulatorArm64 \
            --no-daemon --no-configuration-cache

      - name: Validate watchOS-side BuildKonfig present (freeDebug)
        run: |
          set -euo pipefail
          GEN=samples/multi-target-multi-variant/build/generated/kmpFlavors/commonMain/kotlin/com/example/multitarget/BuildKonfig.kt
          test -f "$GEN" || { echo "::error::BuildKonfig.kt missing at $GEN"; exit 1; }
          grep -qF 'VARIANT_NAME: String = "freeDebug"' "$GEN" || { echo "::error::watchOS-side default variant not freeDebug"; exit 1; }
          echo "✓ watchOS-side default freeDebug BuildKonfig generated"

      - name: Full matrix on watchOS — assembleAllWatchos{X64,Arm64,SimulatorArm64}Variants
        run: |
          # 9 variants × 3 watchOS targets = 27 compilations. Locks in matrix mode
          # for watchOS — any regression in PerVariantComposeResources or
          # MatrixModeAggregateTasks for watchOS surfaces here.
          ./gradlew \
            :samples:multi-target-multi-variant:assembleAllWatchosX64Variants \
            :samples:multi-target-multi-variant:assembleAllWatchosArm64Variants \
            :samples:multi-target-multi-variant:assembleAllWatchosSimulatorArm64Variants \
            --no-daemon --no-configuration-cache
          echo "✓ 27 inactive-variant compilations green on watchOS targets"

      - name: Full matrix on tvOS — assembleAllTvos{X64,Arm64,SimulatorArm64}Variants
        run: |
          # 9 variants × 3 tvOS targets = 27 compilations.
          ./gradlew \
            :samples:multi-target-multi-variant:assembleAllTvosX64Variants \
            :samples:multi-target-multi-variant:assembleAllTvosArm64Variants \
            :samples:multi-target-multi-variant:assembleAllTvosSimulatorArm64Variants \
            --no-daemon --no-configuration-cache
          echo "✓ 27 inactive-variant compilations green on tvOS targets"

  # ─────────────────────────────────────────────────────────────────────
  # Linux runner: linuxX64 (native CLI-friendly target)
  # ─────────────────────────────────────────────────────────────────────
  linux-native-target:
    name: Linux native target (linuxX64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Default variant — linuxX64 compiles
        run: |
          ./gradlew \
            :samples:multi-target-multi-variant:compileKotlinLinuxX64 \
            --no-daemon --no-configuration-cache

      - name: Full matrix on linuxX64 — assembleAllLinuxX64Variants
        run: |
          # 9 variants × 1 target = 9 compilations.
          ./gradlew \
            :samples:multi-target-multi-variant:assembleAllLinuxX64Variants \
            --no-daemon --no-configuration-cache
          echo "✓ 9 inactive-variant compilations green on linuxX64"

  # ─────────────────────────────────────────────────────────────────────
  # Windows runner: mingwX64 (Windows native CLI target)
  # ─────────────────────────────────────────────────────────────────────
  windows-native-target:
    name: Windows native target (mingwX64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Default variant — mingwX64 compiles
        shell: bash
        run: |
          ./gradlew \
            :samples:multi-target-multi-variant:compileKotlinMingwX64 \
            --no-daemon --no-configuration-cache

      - name: Full matrix on mingwX64 — assembleAllMingwX64Variants
        shell: bash
        run: |
          # 9 variants × 1 target = 9 compilations.
          ./gradlew \
            :samples:multi-target-multi-variant:assembleAllMingwX64Variants \
            --no-daemon --no-configuration-cache
          echo "✓ 9 inactive-variant compilations green on mingwX64"

  # ─────────────────────────────────────────────────────────────────────
  # Cost telemetry — comment the per-job CI minutes on the PR so AC 10's
  # "≤ 2× v2.4 baseline" budget is observable. Runs after all build jobs.
  # ─────────────────────────────────────────────────────────────────────
  cost-telemetry:
    name: CI cost telemetry (v2.5 budget check)
    needs: [apple-targets-extended, linux-native-target, windows-native-target]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute + post CI minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Aggregate elapsed time across all jobs of this workflow run.
          MINS=$(gh run view ${{ github.run_id }} \
            --json jobs --jq '[.jobs[] | select(.name | startswith("CI cost telemetry") | not) | .steps[].number] | length' \
            || echo "0")
          # Best-effort: GH CLI doesn't expose precise per-step duration in stable JSON
          # shape, so we post a coarse estimate signal that humans can cross-check
          # against the workflow run page. This is informational, not a hard gate.
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "📊 **sample-target-coverage.yml v2.5 budget check** — workflow completed (${MINS} step entries). \
            See workflow run for precise per-job CI minutes. \
            v2.4 baseline (sample-multi-target.yml): ~50 min combined. \
            v2.5 budget (AC 10): ≤ 2× = 100 min combined across both workflows. \
            If exceeded, sub-plan B includes a CI cost reduction task (matrix-job sharding) before merge."
