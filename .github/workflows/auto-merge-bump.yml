# v2.3 Phase 6A — auto-merge bump PRs after CI green.
#
# The mbl-actionhub-bump-version action's bump.sh enables auto-merge on the
# PR via `gh pr merge --auto --squash`. That works when the repo grants the
# default GITHUB_TOKEN the right scopes. When branch protection requires
# bot-bypass approvals or the bump PR fails to enable auto-merge for any
# other reason, this workflow runs as a safety net — it listens to bump-PR
# events, waits for CI green, then squash-merges with --delete-branch.
#
# Scope is intentionally narrow: only PRs whose head branch matches
# `chore/bump-version-*` are eligible. Any feature PR that happens to be
# opened with that prefix would also auto-merge after CI — keep the prefix
# reserved for the bumper bot.

name: Auto-merge bump PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  actions: read

jobs:
  enable-auto-merge:
    name: Enable auto-merge on bump PRs
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'chore/bump-version-') &&
       github.event.pull_request.user.login == 'github-actions[bot]') ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.conclusion == 'success')

    steps:
      - name: Resolve target PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
          else
            # check_suite — find any open bump PR on the head SHA.
            HEAD_SHA="${{ github.event.check_suite.head_sha }}"
            PR_NUMBER=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "head:chore/bump-version- sha:$HEAD_SHA" \
              --json number --jq '.[0].number // empty')
            if [ -z "$PR_NUMBER" ]; then
              echo "No matching bump PR for SHA $HEAD_SHA — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          fi
          if [[ "$HEAD_REF" != chore/bump-version-* ]]; then
            echo "PR #${PR_NUMBER} head ref '$HEAD_REF' is not a bump PR — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge on PR #$PR_NUMBER (squash + delete-branch)"
          # --auto enables auto-merge once required checks pass; idempotent.
          if ! gh pr merge "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --auto --squash --delete-branch 2>&1 | tee /tmp/gh-merge.log; then
            echo "::warning::Could not enable auto-merge — likely branch protection requires approval bypass."
            echo "::warning::Check repo settings → Branch protection → Restrict pushes for development."
            exit 0
          fi
