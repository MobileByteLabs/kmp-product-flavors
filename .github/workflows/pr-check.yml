# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests on the plugin module (iOS/Linux skipped for speed),
# then validates flavor generation across representative flavor combinations.

name: PR Check

on:
  pull_request:
    branches: [ "development", "main" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.5.4
    with:
      module-path: 'build-logic/flavor-plugin'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false

  sample-build:
    name: Sample (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: pr-check

    strategy:
      matrix:
        flavor: [ freeDev, paidProd, freeStaging ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build Sample (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:assemble -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: Validate Flavors (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:validateFlavors -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: List Flavors
        run: ./gradlew :samples:basic-flavors:listFlavors --no-daemon --no-configuration-cache
  kmp-project-template-sample:
    name: kmp-project-template sample build
    runs-on: ubuntu-latest
    needs: pr-check
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Publish flavor-plugin to mavenLocal (this PR's version)
        working-directory: build-logic
        run: ./gradlew :flavor-plugin:publishToMavenLocal --no-daemon --no-configuration-cache
      - name: Write Android SDK stub + enable mavenLocal in sample
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > samples/kmp-project-template/local.properties
          # Inject mavenLocal so the sample's build-logic and root repositories pick
          # up this PR's version of flavor-plugin instead of waiting for Maven
          # Central. Idempotent: only adds if not already present.
          if ! grep -q 'mavenLocal()' samples/kmp-project-template/build-logic/settings.gradle.kts; then
            sed -i 's|repositories {|repositories {\n        mavenLocal()|' \
              samples/kmp-project-template/build-logic/settings.gradle.kts
          fi
          if ! grep -q 'mavenLocal()' samples/kmp-project-template/settings.gradle.kts; then
            sed -i '0,/repositories {/s|repositories {|repositories {\n        mavenLocal()|' \
              samples/kmp-project-template/settings.gradle.kts
            sed -i '0,/repositories {/!{s|repositories {|repositories {\n        mavenLocal()|;}' \
              samples/kmp-project-template/settings.gradle.kts
          fi
      - name: cmp-shared compile (default variant)
        working-directory: samples/kmp-project-template
        run: ./gradlew :cmp-shared:assemble --no-daemon --no-configuration-cache
      - name: cmp-shared codegen with override
        working-directory: samples/kmp-project-template
        run: |
          ./gradlew :cmp-shared:generateFlavorBuildConfig \
            -PkmpFlavor=clientaBasicDebug --rerun-tasks --no-daemon --no-configuration-cache
          test -f cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
          grep -q 'IS_CLIENTA: Boolean = true' cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
          grep -q 'IS_BASIC: Boolean = true' cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
          grep -q 'BUILD_TYPE: String = "debug"' cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
          grep -q 'IS_DEBUG: Boolean = true' cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
          grep -q 'ENABLE_LOGGING: Boolean = true' cmp-shared/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/FlavorConfig.kt
      - name: listFlavors shows buildType axis (24 variants)
        working-directory: samples/kmp-project-template
        run: |
          out=$(./gradlew :cmp-shared:listFlavors --no-daemon --no-configuration-cache)
          echo "$out"
          # Expect 24 variants (4 consumers × 2 tiers × 3 buildTypes)
          variant_count=$(echo "$out" | grep -cE '^\\│ [a-z][a-zA-Z]+ +\\│' || true)
          if [ "$variant_count" -lt 24 ]; then
            echo "::error::Expected ≥24 variants; got $variant_count"
            exit 1
          fi
