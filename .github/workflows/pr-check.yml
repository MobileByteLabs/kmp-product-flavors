# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests on the plugin module (iOS/Linux skipped for speed),
# then validates flavor generation across representative flavor combinations.

name: PR Check

on:
  pull_request:
    branches: [ "development", "main" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.5.4
    with:
      module-path: 'build-logic/flavor-plugin'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false

  sample-build:
    name: Sample (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: pr-check

    strategy:
      matrix:
        flavor: [ freeDev, paidProd, freeStaging ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build Sample (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:assemble -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: Validate Flavors (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:validateFlavors -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: List Flavors
        run: ./gradlew :samples:basic-flavors:listFlavors --no-daemon --no-configuration-cache

  kmp-project-template-sample:
    name: kmp-project-template sample build
    runs-on: ubuntu-latest
    needs: pr-check
    steps:
      - uses: actions/checkout@v4
        with:
          # samples/kmp-project-template is a git submodule (since PR #103);
          # default checkout doesn't initialize submodules → ./gradlew missing.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > samples/kmp-project-template/local.properties
      - name: Build cmp-shared (composite-include resolves flavor-plugin from THIS branch)
        working-directory: samples/kmp-project-template
        run: ./gradlew :cmp-shared:compileKotlinDesktop :cmp-shared:compileKotlinJs :cmp-shared:compileKotlinWasmJs --no-daemon --no-configuration-cache
      - name: Validate FlavorConfig codegen (default variant)
        working-directory: samples/kmp-project-template
        # Multi-module codegen-host claim mechanism: only ONE module per project
        # generates the BuildKonfig.kt (others skip with "already generated by :X").
        # For kmp-project-template the claim winner is :cmp-navigation (deterministic
        # across configurations seen in CI + local runs). Target :cmp-navigation
        # directly to avoid the "task not found in :cmp-shared" failure.
        #
        # Variant model in submodule SHA 45ca0f0:
        #   tier (base):       demo (default) | prod
        #   buildType (base):  debug (default) | staging | release
        # (Optional LocalFlavors.kt at build-logic/convention/src/main/kotlin/local/LocalFlavors.kt
        # can extend with additional flavor dimensions; not shipped in current SHA so
        # the matrix is 2 tiers × 3 buildTypes = 6 variants, active = demoDebug.)
        run: |
          ./gradlew :cmp-navigation:generateFlavorBuildConfig --rerun-tasks --no-daemon --no-configuration-cache
          GEN=cmp-navigation/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/BuildKonfig.kt
          test -f "$GEN" || { echo "::error::BuildKonfig.kt missing"; exit 1; }
          for needle in 'VARIANT_NAME: String = "demoDebug"' 'IS_DEMO: Boolean = true' 'IS_PROD: Boolean = false' 'BUILD_TYPE: String = "debug"' 'IS_DEBUG: Boolean = true' 'ENABLE_LOGGING: Boolean = true' 'LOG_TAG: String = "KMPTemplate-DEBUG"' 'IS_DEMO_BUILD: Boolean = true'; do
            if ! grep -qF "$needle" "$GEN"; then
              echo "::error::Missing expected line: $needle"
              cat "$GEN"
              exit 1
            fi
          done
          echo "✓ BuildKonfig.kt contains all expected flavor + buildType constants"
      - name: Validate variant override (-PkmpFlavor=prodStaging)
        working-directory: samples/kmp-project-template
        run: |
          ./gradlew :cmp-navigation:generateFlavorBuildConfig -PkmpFlavor=prodStaging --rerun-tasks --no-daemon --no-configuration-cache
          GEN=cmp-navigation/build/generated/kmpFlavors/commonMain/kotlin/org/openmf/kmptemplate/BuildKonfig.kt
          for needle in 'VARIANT_NAME: String = "prodStaging"' 'IS_PROD: Boolean = true' 'IS_DEMO: Boolean = false' 'BUILD_TYPE: String = "staging"' 'IS_STAGING: Boolean = true' 'IS_DEMO_BUILD: Boolean = false'; do
            if ! grep -qF "$needle" "$GEN"; then
              echo "::error::Override missing line: $needle"
              cat "$GEN"
              exit 1
            fi
          done
          echo "✓ Override variant correctly regenerates FlavorConfig"
