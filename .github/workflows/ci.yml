# CI Workflow — delegates to mbl-actionhub reusable CI workflow
#
# Triggers:
#   - push to development or main (full build)
#   - workflow_call (invoked by publish.yml before every Maven publish)
#
# PRs are handled separately by pr-check.yml (fast gate).

name: CI

on:
  push:
    branches: [ "development", "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.5.0
    with:
      module-path: 'build-logic/flavor-plugin'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true

  sample-build:
    name: Sample (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: ci

    strategy:
      matrix:
        flavor: [ freeDev, paidProd, freeStaging, paidDev, freeProd ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Sample (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:assemble -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: Validate Flavors (${{ matrix.flavor }})
        run: ./gradlew :samples:basic-flavors:validateFlavors -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache

      - name: List Flavors
        run: ./gradlew :samples:basic-flavors:listFlavors --no-daemon --no-configuration-cache

      - name: Generate BuildConfig
        run: ./gradlew :samples:basic-flavors:generateFlavorBuildConfig -PkmpFlavor=${{ matrix.flavor }} --no-daemon --no-configuration-cache
