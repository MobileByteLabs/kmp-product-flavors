# CI Workflow — full build on push to development/main
# Also invoked by publish-release.yml before every Maven publish (workflow_call).
#
# PRs are handled by pr-check.yml (fast gate). This workflow runs the same
# quality + test checks plus a full Linux sample compile to confirm the merged
# state is always green on the default branch.

name: CI

on:
    push:
        branches: [development, main]
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.5.4
        with:
            module-path: 'build-logic/flavor-plugin'
            java-version: '21'
            java-distribution: 'zulu'
            run-quality: true

    # Compile all registered samples on Linux after the core CI passes.
    # compileSamples<Target> aggregate tasks auto-discover every sample in
    # settings.gradle.kts — no job changes needed when a sample is added.
    compile-samples:
        name: Compile all samples (Linux)
        runs-on: ubuntu-latest
        needs: ci
        steps:
            - uses: actions/checkout@v4

            - name: Setup JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: '21'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Compile all samples — Desktop + JS + WasmJs
              run: |
                  ./gradlew \
                      compileSamplesDesktop \
                      compileSamplesJs \
                      compileSamplesWasmJs \
                      --no-daemon --no-configuration-cache

            - name: Compile all samples — linuxX64
              run: |
                  ./gradlew compileSamplesLinuxX64 --no-daemon --no-configuration-cache
