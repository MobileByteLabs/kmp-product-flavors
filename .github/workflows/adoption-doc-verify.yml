name: Adoption doc drift gate

# Runs every release-time check (CI) block in the adoption docs against
# the actual codebase. If any block exits non-zero, the PR fails — forcing
# either an implementation revert or a doc update.
#
# This makes the adoption doc the SINGLE SOURCE OF TRUTH: the doc's
# verify blocks ARE the contract; CI is the enforcement.
#
# See docs/adoption/README.md "Three-tier source-of-truth chain" and
# scripts/adoption-doc-verify.py --help for the mechanics.

on:
  pull_request:
    paths:
      # Trigger when the doc itself changes
      - 'docs/adoption/**'
      # OR when any file the doc's verify blocks depend on changes
      - 'build-logic/flavor-plugin/src/main/kotlin/**'
      - 'build-logic/flavor-plugin/src/test/kotlin/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'docs/COMPATIBILITY_MATRIX.md'
      - 'docs/MIGRATION_*.md'
      - 'docs/AGP_*.md'
      - 'docs/ERROR_CODES.md'
      - '.github/workflows/agp-matrix-compat.yml'
      - '.github/workflows/pr-check.yml'
      - 'scripts/adoption-doc-verify.py'
      - '.github/workflows/adoption-doc-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tier-1:
    name: Tier 1 — library adoption doc gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run drift gate on library.md (release-time CI checks)
        run: |
          python3 scripts/adoption-doc-verify.py \
            docs/adoption/v2.7/library.md

      - name: Annotate failure with remediation guidance
        if: failure()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Adoption doc drift detected

          One or more release-time check (CI) blocks in `docs/adoption/v2.7/library.md`
          failed against the current codebase. This means EITHER:

          1. The implementation drifted — file moved, renamed, removed, or a
             structural assumption broke. **Revert the change** OR update the
             adoption doc's verify block + "What the library did" section to
             reflect the new reality.

          2. The verify block was wrong (false positive). **Fix the verify
             block** in the doc and re-push.

          Do NOT silence the gate by removing the verify block — that defeats
          the single-source-of-truth contract documented in
          [`docs/adoption/README.md`](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/docs/adoption/README.md).

          To reproduce locally:
          ```
          python3 scripts/adoption-doc-verify.py docs/adoption/v2.7/library.md
          ```
          EOF
