# v2.8 — Educational sample CI
#
# Exercises the v2.8 sample modules on a Linux runner (Desktop + JS + WasmJs
# targets only — iOS samples are reference-only and compiled separately via
# sample-multi-target.yml on macos-latest).
#
# Samples covered:
#   - desktop-flavor-integration  — Desktop JVM, two env flavors
#   - web-flavor-integration      — JS (IR) + WasmJs, per-flavor Webpack globals
#   - runtime-api-integration     — KmpFlavorsRuntime expect/actual + Desktop actual
#
# Excluded from CI (run locally only):
#   - dsl-completeness-integration — "kitchen sink" DSL reference; JS-only (no wasmJs target)
#   - pure-agp-app and ios-flavor-integration — require Android SDK / macOS

name: v2.8 feature samples

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'build-logic/flavor-plugin/**'
      - 'samples/desktop-flavor-integration/**'
      - 'samples/web-flavor-integration/**'
      - 'samples/runtime-api-integration/**'
      - 'settings.gradle.kts'
      - '.github/workflows/sample-v28-features.yml'
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: sample-v28-features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v28-samples-linux:
    name: v2.8 samples (Desktop + JS + WasmJs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: desktop-flavor-integration — compile Desktop
        run: |
          ./gradlew :samples:desktop-flavor-integration:compileKotlinDesktop \
            --no-daemon --no-configuration-cache

      - name: desktop-flavor-integration — compile with prod flavor
        run: |
          ./gradlew :samples:desktop-flavor-integration:compileKotlinDesktop \
            -PkmpFlavor=prod \
            --rerun-tasks --no-daemon --no-configuration-cache

      - name: web-flavor-integration — compile JS + WasmJs
        run: |
          ./gradlew \
            :samples:web-flavor-integration:compileKotlinJs \
            :samples:web-flavor-integration:compileKotlinWasmJs \
            --no-daemon --no-configuration-cache

      - name: runtime-api-integration — compile Desktop (default demo flavor)
        run: |
          ./gradlew :samples:runtime-api-integration:compileKotlinDesktop \
            --no-daemon --no-configuration-cache

      - name: runtime-api-integration — compile Desktop with prod flavor
        run: |
          ./gradlew :samples:runtime-api-integration:compileKotlinDesktop \
            -PkmpFlavor=prod \
            --rerun-tasks --no-daemon --no-configuration-cache
