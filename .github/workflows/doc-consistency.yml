name: Doc consistency

on:
  pull_request:
    paths:
      - 'build-logic/flavor-plugin/**'
      - 'docs/**'
      - 'README.md'
      - 'samples/**/libs.versions.toml'
      - '.github/workflows/doc-consistency.yml'
  push:
    branches: [development, main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # G17 — Kdoc plugin id must match gradlePlugin registration
      - name: Plugin id consistency (Kdoc vs gradlePlugin)
        run: |
          set -euo pipefail
          REGISTERED=$(grep -oE 'id = "io\.github\.[a-z.]+\.kmp-product-flavors"' \
            build-logic/flavor-plugin/build.gradle.kts | head -1)
          KDOC=$(grep -oE 'id\("io\.github\.[a-z.]+\.kmp-product-flavors"\)' \
            build-logic/flavor-plugin/src/main/kotlin/com/mobilebytelabs/kmpflavors/KmpFlavorPlugin.kt | head -1)

          if [ -z "$REGISTERED" ] || [ -z "$KDOC" ]; then
            echo "::error::could not extract plugin id from one or both sources"
            echo "registered: $REGISTERED"
            echo "kdoc:       $KDOC"
            exit 1
          fi

          # Normalise to bare id.
          REG_ID=$(echo "$REGISTERED" | grep -oE 'io\.github\.[a-z.]+\.kmp-product-flavors')
          KDOC_ID=$(echo "$KDOC" | grep -oE 'io\.github\.[a-z.]+\.kmp-product-flavors')

          if [ "$REG_ID" != "$KDOC_ID" ]; then
            echo "::error::Plugin id mismatch — Kdoc says $KDOC_ID but build.gradle.kts registers $REG_ID"
            exit 1
          fi
          echo "✓ plugin id consistent: $REG_ID"

      # G5 — no stale 0.1.0 in versioned doc / catalog files
      - name: No stale 0.1.0 version refs
        run: |
          set -euo pipefail
          if grep -rEn 'version[ .]*=[ ]*"0\.1\.0"' \
              docs/ samples/*/gradle/libs.versions.toml 2>/dev/null; then
            echo "::error::stale 0.1.0 version reference found above — bump to current published version"
            exit 1
          fi
          # Doc YAML metadata block in integration guide
          if grep -E '^plugin_version: 0\.1\.0$' \
              docs/KMP_PROJECT_TEMPLATE_INTEGRATION.md; then
            echo "::error::docs/KMP_PROJECT_TEMPLATE_INTEGRATION.md plugin_version is stale (0.1.0)"
            exit 1
          fi
          echo "✓ no stale version refs"
