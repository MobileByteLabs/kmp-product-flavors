# Coverage gate (v2.6) — Kover line-coverage verification + Pitest mutation report
#
# Runs `koverVerify` against the floor declared in flavor-plugin/build.gradle.kts
# (`-PkoverLineMin` default = 25, empirical baseline 2026-06-01). Pitest mutation
# testing runs in informational-only mode (failure doesn't block the gate); the
# HTML report is uploaded as a PR artifact for reviewer eyeballs.
#
# Filter + verify shape mirrors mifos-x/kmp-project-template's proven
# `configureKoverRootReports()` (KMP + multi-module). v2.6.x roadmap ramps the
# floor toward 95 via `-PkoverLineMin=...` overrides as individual gaps close
# (see docs/COVERAGE_GUIDE.md and v26-stability-parity-beyond-platform Tier E).

name: Coverage gate (v2.6)

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/coverage-gate.yml'
  workflow_dispatch:
    inputs:
      kover-line-min:
        description: 'Override line-coverage floor (default = build.gradle.kts default = 25)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kover-verify:
    name: Kover gate (floor via -PkoverLineMin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run koverVerify
        run: |
          ./gradlew :build-logic:flavor-plugin:koverVerify \
            ${{ inputs.kover-line-min && format('-PkoverLineMin={0}', inputs.kover-line-min) || '' }} \
            --no-daemon --no-configuration-cache --warning-mode=summary

      - name: Generate HTML + XML coverage reports
        if: always()
        run: |
          ./gradlew :build-logic:flavor-plugin:koverHtmlReport :build-logic:flavor-plugin:koverXmlReport \
            --no-daemon --no-configuration-cache --warning-mode=summary

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: build-logic/flavor-plugin/build/reports/kover/
          if-no-files-found: warn
          retention-days: 14

  pitest-informational:
    name: Pitest mutation report (informational)
    runs-on: ubuntu-latest
    needs: kover-verify
    # Pitest stays informational in v2.6 — promoted to gate v2.7+ once score stabilises.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run Pitest (informational only — failure does not block PR)
        run: |
          ./gradlew :build-logic:flavor-plugin:pitest \
            --no-daemon --no-configuration-cache --warning-mode=summary || \
          echo "::warning::Pitest produced no mutation report — informational only, PR not blocked."

      - name: Upload Pitest mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutation-report
          path: build-logic/flavor-plugin/build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 14
