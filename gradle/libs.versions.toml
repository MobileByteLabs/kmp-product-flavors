[versions]
# Core Dependencies (aligned with kmp-project-template)
agp = "9.4.0"
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "36"
vanniktechMavenPublish = "0.37.0"

# Code Quality (aligned with kmp-project-template)
detekt = "1.23.8"
spotless = "8.10.2"
ktlint = "1.8.0"

# Testing
junit = "4.13.2"
coroutines = "1.11.0"
mockk = "1.14.11"

# v2.6 Phase 1 — coverage gate + mutation testing baseline
kover = "0.9.9"
# Resolved by plugin ID from the Gradle Plugin Portal (settings.gradle.kts:22), so check
# versions at https://plugins.gradle.org/plugin/info.solidsoft.pitest — NOT Maven Central.
# Central holds two decoys: `org.pitest:pitest` is the ENGINE (currently 1.30.x, a different
# artifact — pinning it here fails with "plugin not found"), and the mirrored
# `info.solidsoft.gradle.pitest:gradle-pitest-plugin` lags at 1.15.0, which makes the real
# version look older than it is.
pitest = "1.19.0"
pitestJunit5 = "1.2.3"

# AndroidX (aligned with kmp-project-template)
androidx-activityCompose = "1.13.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# v2.6 Phase 1 — coverage gate (95% line / 90% branch) + Pitest mutation baseline
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
