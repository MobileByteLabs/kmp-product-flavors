[versions]
# Core Dependencies (aligned with kmp-project-template)
agp = "9.2.1"
kotlin = "2.3.21"
compose-multiplatform = "1.10.3"
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "36"
vanniktechMavenPublish = "0.36.0"

# Code Quality (aligned with kmp-project-template)
detekt = "1.23.8"
spotless = "7.0.3"
ktlint = "1.8.0"

# Testing
junit = "4.13.2"
coroutines = "1.10.2"
mockk = "1.13.16"

# v2.6 Phase 1 — coverage gate + mutation testing baseline
kover = "0.9.1"
pitest = "1.19.0-rc.1"
pitestJunit5 = "1.2.1"

# AndroidX (aligned with kmp-project-template)
androidx-activityCompose = "1.12.2"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# v2.6 Phase 1 — coverage gate (95% line / 90% branch) + Pitest mutation baseline
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
