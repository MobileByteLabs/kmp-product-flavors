# Multi-version KGP CI matrix — v2.8 floor
#
# Version pins for the nightly multi-kgp-matrix.yml workflow that runs the
# plugin's TestKit suite against multiple Kotlin Gradle Plugin versions.
#
# v2.8 raised the floor to AGP 9.2.1+ / Gradle 9.5.1+ / Kotlin 2.3.21+ per
# the AGP 9.2.1+ floor policy. Pre-v2.8 KGP rows (2.1.x, 2.2.x) and
# Gradle 9.0 are below the floor and were dropped.
#
# As new KGP minors ship, add rows here AND to `.github/workflows/multi-kgp-matrix.yml`.
#
# NOTE: the workflow does NOT parse this file — its `matrix.kgp-version` array is
# hardcoded. This TOML is the documented source of truth, but propagation is a
# manual lock-step edit of both files. (The header previously claimed a single
# edit propagated automatically; it never did.)
#
# Schema:
#   - versions — array of KGP version strings the workflow exercises.
#   - gradle-version — the Gradle version each row of the matrix runs against
#     (held constant; varying both axes would be a multi-cell matrix and not
#     worth the CI minutes).
#   - compose-multiplatform — CMP version pinned per KGP row (CMP <-> KGP have
#     specific compat constraints; pinning per-row avoids muddying signal).

[matrix]
gradle-version = "9.5.1"

[[matrix.kgp]]
version = "2.3.21"
# CMP 1.10.3 tracks Kotlin 2.3.21 — the v2.8 floor line. Kept as the FLOOR row:
# the plugin supports a range, so the oldest supported KGP must stay exercised.
compose-multiplatform = "1.10.3"

[[matrix.kgp]]
version = "2.4.20"
# The current Kotlin line (the version the plugin itself builds against).
compose-multiplatform = "1.12.0"
